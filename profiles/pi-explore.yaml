# Camera-guided exploration; inherits omitted settings from rubble.yaml.
# Compatible with the running clap-distress service on port 8767.
rover:
  navigation:
    # Verified on this Pi/rover: port 10 returns valid range; port 6 has no echo.
    sensor_port: 10
  decisions:
    # Keep forward motor output running while camera/API and audio checks continue.
    continuous_forward: true
    # Recheck no-echo readings and ordinary obstacles without ending exploration.
    autonomous_exploration: true
    # Operator-selected camera control when a healthy RANGE reply has valid=0.
    no_echo_camera_motion: true
    # Only the camera's INSPECT_DEBRIS choice starts the stationary listening procedure.
    inspection_trigger: debris_only
    debris_approach:
      # Approach visible debris before starting the stationary listening procedure.
      enabled: true
      # Nominal gap measured from the ultrasonic sensor face, not proof of contact.
      stop_cm: 3.0
      # Accept arrival within half a centimeter of the nominal target.
      arrival_tolerance_cm: 0.5
    # Reserve at most 20 cm per cruise, preserving budget for later directions.
    cruise_chunk_cm: 20
    # Enable a voltage cutoff only after verifying this pack type and ADC calibration.
    min_battery_v: null
    # Bound the single continuous forward target in milliseconds.
    cruise_max_ms: 15000
    action_descriptions:
      FORWARD_SHORT: >-
        Start or continue a bounded forward segment within the remaining operator
        distance budget. The host fixes speed and distance, continuously checks
        audio and range, and requests new camera decisions during movement.
        Prefer this choice while exploring visibly supported, unobstructed ground
        when forward movement is offered. A distant object beyond clear_cm is
        not by itself a reason to stop before the next bounded segment.
      # Keep a stop option for hazards and uncertainty while favoring useful exploration.
      HOLD: >-
        Stay stopped, or stop the active segment, and obtain a fresh observation
        when the image shows a person obstructing travel, an edge, unsupported
        ground, a blocked path with no visibly supported offered turn, or when
        evidence is ambiguous, stale or incomplete. The normal destination stop
        is the close debris target, not an arbitrary distance from it. While
        aligned debris remains reachable on supported ground and APPROACH_DEBRIS
        is offered, continue the approach until the close target is reached.
        Do not HOLD just because the target is within the ordinary forward-start
        threshold. For inspection on arrival, choose INSPECT_DEBRIS instead.
      APPROACH_DEBRIS: >-
        Approach recognizable debris that is aligned ahead using a short bounded
        forward move. Prefer this over ordinary forward travel when approaching
        a debris site. Continue choosing this while front_cm exceeds
        debris_stop_cm plus debris_arrival_tolerance_cm and the target remains
        aligned and reachable. This guarded approach has its own close stopping
        gap; clear_cm applies to ordinary travel. Reassess the image after each
        move; HOLD if alignment, support, identity or the approach path becomes
        uncertain.
      INSPECT_DEBRIS: >-
        Stop and listen at visible debris after the host's close-distance target
        is reached. This choice is unavailable while the target is far away or
        distance is unknown. It does not establish physical microphone contact.
    # Accept offered motion proposals scoring at least 0.50; local motion guards still apply.
    min_confidence: 0.50
    # Reach a close debris position before listening; motion stays locally bounded.
    mission: >-
      Actively explore the visible supported ground and find debris or rubble
      worth inspecting. Prefer progress over repeated HOLD on open ground.
      The normal inspection destination is debris_stop_cm from aligned debris,
      measured from the ultrasonic sensor, within debris_arrival_tolerance_cm.
      Prioritize APPROACH_DEBRIS when recognizable debris is aligned ahead and
      the approach is offered. Continue toward that same target while the
      measured gap is larger than the arrival target and the path remains
      supported and unobstructed. Do not stop just because the debris is within
      clear_cm: the close approach uses its own stopping gap. On measured
      arrival with the debris still visible, choose INSPECT_DEBRIS.
      Otherwise explore. Use front_cm as the measured forward distance in
      centimeters and clear_cm as the host's ordinary forward-start threshold.
      When no aligned debris target takes priority, range_valid is true,
      front_cm is at least clear_cm, and the next offered segment is visibly
      supported and unobstructed, choose FORWARD_SHORT. A distant object alone
      is not a reason to HOLD; reassess it as the rover gets closer. Range alone
      cannot establish traversable ground or exclude people, edges or hazards.
      During forward travel FORWARD_SHORT means continue the
      active bounded segment. If an ordinary obstacle blocks forward progress,
      choose an offered short turn toward a visibly supported alternative;
      turn proposals during travel first stop the rover and require another
      observation before a turn is dispatched. Never infer side clearance or
      absence of an edge from front ultrasonic distance alone.
      Check alignment, support and target identity after each short approach.
      Do not start listening merely because distant debris is visible.
      The final listening position needs a valid close distance; an
      unknown echo is never proof of arrival or microphone contact.
      Only close visual debris starts an investigation. Sounds are recorded but do not
      request a stop while exploring. Listen for knock responses after stopping
      at a debris site. A person or ordinary background sound alone does not
      start the listening procedure; retain HOLD for a person obstructing travel.
      When range_valid is false and no_echo_camera_motion is true, choose an
      offered movement using the fresh camera view of visibly supported and
      unobstructed ground. A missing echo is unknown distance, not proof of open
      space. Continue positioning toward an aligned visible target only on
      supported unobstructed ground; the host requires usable range for the
      final close approach. Choose HOLD
      for an edge, unsupported ground, ambiguous travel evidence or unsafe turn.
      Respect the host's time and distance budgets. Reserved forward distance
      is not completed travel. No response never means nobody is there.
    # Pi lifted-track bench: 25% timed out; 35% completed 3 cm within 1 s. Floor test pending.
    speed_pct: 35
    # Cap the sum of forward requests; physical distance needs calibration.
    forward_budget_cm: 100
    # Bound this exploration session to two minutes, including stationary holds.
    session_s: 120
  audio_stop:
    # Applies only to hb patrol; hb listen/run never issue motor commands.
    enabled: true
    # Classes remain available as evidence after the camera selects a debris site.
    trigger_mode: all
    # Continue through route checkpoints without scheduled audio investigations.
    scheduled_listen: false
    # One accepted knock can qualify evidence at a debris site; it cannot stop exploration.
    knock_count: 1
classifier:
  # Explicit selection; does not change the default Pi/YAMNet/heuristic path.
  name: clap
  # Initial relative-score threshold only; calibrate on real short onset clips.
  threshold: 0.6
  clap:
    # Change the host to the Jetson's LAN address for remote inference.
    endpoint: http://127.0.0.1:8767
    # Per-request transport timeout; failed inference uses the configured fallback.
    timeout_s: 1.5
    # Maximum queued/in-flight onset requests, including the active request.
    max_pending: 4
    # Maximum stream-time age from impact to result, including 0.875s look-ahead.
    max_lag_s: 2.5
    # Pretrained model already used in the exploratory five-second tester.
    model: laion/clap-htsat-unfused
    # Model repository revision; use the same value on service and client.
    revision: main
    # CPU on Mac; set cuda for a Jetson with a compatible GPU-enabled PyTorch.
    device: cpu
    # Torch CPU threads; benchmark rather than assuming more threads is faster.
    cpu_threads: 2
    # These descriptions together define the positive class.
    positive_prompts:
      - The sound of a person knocking on a table with their knuckles.
      - The sound of a person banging on a table with their fist.
    # Fixed comparison classes; changing descriptions also changes score meaning.
    negative_prompts:
      - The sound of an object being dropped or set down on a table.
      - The sound of a table being accidentally bumped.
      - The sound of a mechanical motor or servo clicking and tapping.
      - The sound of footsteps.
      - The sound of people talking or a speaker playing speech.
      - The sound of music playing.
      - The sound of typing on a keyboard.
      - The sound of quiet background room noise.
    # Continuous vocal observations; never fed to knock-pattern counting.
    monitor:
      # Classify vocal windows alongside impact clips; transcription stays disabled.
      enabled: true
      # Duration and interval of overlapping windows, in seconds.
      window_s: 3.0
      hop_s: 1.0
      # Uncalibrated relative class-score cutoff.
      threshold: 0.55
      # Skip very quiet windows before classification/transcription.
      min_dbfs: -50.0
      # Minimum seconds between review alerts; observations still logged.
      cooldown_s: 5.0
      # Bound the monitor HTTP request, including optional transcription.
      timeout_s: 3.0
      # Vocal classes and ordinary comparison sounds are separate from knocks.
      prompts:
        SCREAM:
          - The sound of a person screaming.
        SHOUT:
          - The sound of a person shouting loudly.
        CRYING:
          - The sound of a person crying and sobbing.
        SPEECH:
          - The sound of a person speaking normally.
        # Informational only: breathing does not trigger a distress alert.
        BREATHING:
          - The sound of a person breathing in and out.
          - The sound of a person breathing heavily and panting.
        OTHER:
          - The sound of people laughing and cheering.
          - The sound of music or television playing.
          - The sound of machinery and motors running.
          - The sound of knocking or objects banging on a table.
          - The sound of quiet background room noise.
          - The sound of wind blowing across a microphone.
          - The sound of a fan blowing air.
          - The sound of clothing rustling against a microphone.
      # Optional English transcription. Off avoids an extra model download.
      asr:
        enabled: false
        model: openai/whisper-tiny.en
        revision: main
        # Whole-word phrase matching on normalized transcripts; not proof of distress.
        phrases:
          - help
          - help me
          - I am trapped
          - I'm trapped
          - over here
