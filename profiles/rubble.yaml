audio:
  # Contract sample rate for processing and recordings, in Hz.
  sample_rate: 16000
  # Contract processing hop, in samples.
  block: 256
  # Maximum queued microphone blocks before the oldest is dropped.
  queue_blocks: 32
  # Frequency of level events sent to subscribers, in Hz.
  level_hz: 10.0
  # Interval between console level meters, in seconds.
  console_level_s: 1.0
  # Lower bound of the console meter, in dBFS.
  meter_min_dbfs: -80.0
  # Upper bound of the console meter, in dBFS.
  meter_max_dbfs: 0.0
  # Number of characters in the console meter.
  meter_width: 24
  # Countdown before a labeled recording, in seconds.
  record_countdown_s: 3
  # Warn when a recording's absolute peak exceeds this value.
  record_clip_peak: 0.99
  # Warn when a recording's absolute peak is below this value.
  record_quiet_peak: 0.02
  # StickC-Plus SE bridge-supported transport rate; firmware must match, in baud.
  stick_baud: 500000
  # Host gain applied to stick PCM before clipping to the audio contract, in dB.
  stick_gain_db: 0.0
  synth:
    # Peak amplitude used to normalize individual generated sounds.
    peak: 0.8
    scene:
      # Default generated scene duration, in seconds.
      duration_s: 60.0
      # Default random seed for the synth command.
      seed: 1
      # Default background RMS level, in dBFS.
      bg_dbfs: -50.0
      # Time of the first sound in the CLI demo, in seconds.
      first_event_s: 0.75
      # Spacing between CLI demo sounds, in seconds.
      interval_s: 0.8
      # Gain applied to each CLI demo sound, in dB.
      gain_db: -6.0
      # Repeating sound sequence in the CLI demo scene.
      kinds: [knock, footstep, knock, clap, knock, speech_like, knock, drop]
    knock:
      # Total knock waveform length, in seconds.
      duration_s: 0.2
      # Minimum number of resonant modes.
      modes_min: 2
      # Maximum number of resonant modes.
      modes_max: 3
      # Lowest resonant mode frequency, in Hz.
      low_hz: 150.0
      # Highest resonant mode frequency, in Hz.
      high_hz: 1200.0
      # Shortest exponential decay constant, in seconds.
      decay_min_s: 0.01
      # Longest exponential decay constant, in seconds.
      decay_max_s: 0.04
      # Initial click duration, in seconds.
      click_s: 0.002
      # Initial click amplitude relative to the resonant modes.
      click_gain: 0.35
    footstep:
      # Total low-thump waveform length, in seconds.
      duration_s: 0.35
      # Lowest thump frequency, in Hz.
      low_hz: 50.0
      # Highest thump frequency, in Hz.
      high_hz: 120.0
      # Thump exponential decay constant, in seconds.
      decay_s: 0.06
    clap:
      # Total broadband burst length, in seconds.
      duration_s: 0.2
      # Broadband burst exponential decay constant, in seconds.
      decay_s: 0.025
    speech_like:
      # Total modulated noise length, in seconds.
      duration_s: 0.7
      # Lower speech-like band edge, in Hz.
      low_hz: 300.0
      # Upper speech-like band edge, in Hz.
      high_hz: 3000.0
      # Envelope modulation frequency, in Hz.
      modulation_hz: 4.0
      # Envelope modulation depth, between zero and one.
      modulation_depth: 0.8
    drop:
      # Total bouncing-object waveform length, in seconds.
      duration_s: 0.8
      # Minimum number of bounces.
      bounces_min: 2
      # Maximum number of bounces.
      bounces_max: 4
      # Delay between the first two bounces, in seconds.
      first_gap_s: 0.14
      # Ratio by which the delay shrinks after each bounce.
      gap_ratio: 0.65
      # Ratio by which amplitude shrinks after each bounce.
      gain_ratio: 0.6
    background:
      # Default standalone background waveform duration, in seconds.
      duration_s: 1.0
      # Frequency below which the pink-noise spectrum flattens, in Hz.
      low_hz: 20.0
      # Frequency-domain amplitude exponent for pinkish noise.
      pink_exponent: 0.5
onset:
  # Second-order high-pass cutoff, in Hz.
  highpass_hz: 60.0
  # Required hop RMS above the estimated noise floor, in dB.
  threshold_db: 12.0
  # Re-arm below this SNR so a decaying double hit cannot retrigger, in dB.
  rearm_db: 6.0
  # Minimum hop RMS that can trigger an onset, in dBFS.
  min_dbfs: -55.0
  # Minimum interval between onsets, in seconds.
  refractory_s: 0.12
  # Rolling noise-floor history duration, in seconds.
  floor_window_s: 3.0
  # Percentile of eligible hop levels used for the noise floor.
  floor_percentile: 20.0
  # Time after each onset excluded from noise-floor estimation, in seconds.
  floor_exclude_s: 0.3
  # Noise-floor estimate before eligible audio history is available, in dBFS.
  initial_floor_dbfs: -50.0
classifier:
  # Optional external CLAP service settings; enabled only by profiles/clap.yaml.
  clap: null
  # Prefer a trained head, then YAMNet, then the dependency-free heuristic.
  name: auto
  # Synthetic sensitivity/FPR tradeoff; recalibrate with real contact recordings.
  threshold: 0.3681996792882003
  # Display names whose largest YAMNet score is the zero-shot knock score.
  targets: [Knock, Tap, "Thump, thud"]
  # Directory containing yamnet.tflite and yamnet_class_map.csv.
  model_dir: models
  # Small trained classifier artifact, including its feature spec and threshold.
  head_path: models/knock_head.joblib
  # CPU inference threads; benchmark this on the target Raspberry Pi.
  num_threads: 2
  features:
    # Maximum DSP analysis after the onset, in seconds; YAMNet keeps the full clip.
    feature_post_s: 0.25
    # Envelope rise above the decayed impact that marks another onset, in dB.
    feature_next_rise_db: 8.0
    # Earliest later impact to split from the initial onset, in seconds.
    feature_next_min_s: 0.03
    # Continuous decay-floor dwell required before a later rise can split, in seconds.
    feature_next_quiet_s: 0.012
    # RMS envelope smoothing window, in seconds.
    envelope_s: 0.002
    # Fraction of peak envelope marking the start of the attack.
    attack_fraction: 0.1
    # Envelope drop relative to its peak used to measure decay, in dB.
    decay_db: -20.0
    # FFT window length for spectral and log-mel features, in samples.
    fft_size: 512
    # Spectral frame hop, in samples.
    fft_hop: 160
    # Number of log-mel means in the feature contract.
    mel_bands: 32
    # Lowest mel filter edge, in Hz.
    mel_low_hz: 60.0
    # Highest mel filter edge, in Hz.
    mel_high_hz: 7800.0
    # Boundary between low and middle spectral energy bands, in Hz.
    low_mid_hz: 250.0
    # Boundary between middle and high spectral energy bands, in Hz.
    mid_high_hz: 2000.0
    # Positive floor for logarithms and numerical divisions.
    log_floor: 1.0e-12
  heuristic:
    # Longest short-window impulsive attack receiving full knock support, in seconds.
    attack_max_s: 0.008
    # Longest short-window decay receiving full knock support, in seconds.
    decay_max_s: 0.11
    # Upper spectral centroid reference for knock-like support, in Hz.
    centroid_max_hz: 2200.0
    # Lower centroid reference rejecting very low-frequency thumps, in Hz.
    centroid_min_hz: 150.0
    # High-band energy ratio beyond which knock support falls to zero.
    high_ratio_max: 0.3
    # Peak-to-RMS ratio needed for full impulsiveness support.
    peak_rms_min: 3.0
    weights:
      # Relative contribution of attack time to the heuristic score.
      attack: 1.0
      # Relative contribution of decay time to the heuristic score.
      decay: 1.0
      # Relative contribution of spectral centroid to the heuristic score.
      centroid: 2.0
      # Relative contribution of rejecting low-frequency thumps.
      centroid_low: 2.0
      # Relative contribution of high-band energy to the heuristic score.
      high_ratio: 2.0
      # Relative contribution of impulsiveness to the heuristic score.
      peak_rms: 1.0
  training:
    # Reproducible seed for source-group splits and logistic regression.
    random_seed: 42
    # Requested number of cross-validation folds, grouped by recording.
    cv_splits: 5
    # Fraction of source groups reserved only for threshold calibration.
    calibration_fraction: 0.25
    # Calibration false-positive limit trading sensitivity against synthetic noise.
    max_false_positive_rate: 0.05
    # Inverse regularization strength of the balanced logistic regression.
    logistic_c: 1.0
    # Minimum standard-deviation scale for sparse YAMNet probability features.
    score_scale_floor: 0.01
    # Maximum optimization iterations for the logistic regression.
    logistic_max_iter: 1000
    # Repeated predictions used to measure classifier inference speed.
    speed_repeats: 20
    # Full head features; DSP-only mode requires an explicit CLI override.
    feature_mode: yamnet_dsp
    synthetic:
      # Independent source recordings per synthetic sound kind for the dry run.
      recordings_per_kind: 96
      # Labeled events per synthetic source recording.
      events_per_recording: 6
      # Separation between synthetic events, in seconds.
      interval_s: 1.2
      # Minimum random spacing in mixed-speed synthetic training, in seconds.
      interval_min_s: 0.3
      # Maximum random spacing in mixed-speed synthetic training, in seconds.
      interval_max_s: 1.2
      # Fraction of synthetic recordings using steady human tempo with jitter.
      steady_fraction: 0.5
      # Maximum per-gap jitter in steady-tempo training recordings, in seconds.
      spacing_jitter_s: 0.04
      # Lead-in before the first synthetic event, in seconds.
      first_event_s: 0.75
      # Audio retained after the last event, in seconds.
      tail_s: 1.0
      # Background RMS in synthetic labeled recordings, in dBFS.
      background_dbfs: -55.0
      # Quietest background sampled independently for each labeled recording.
      background_min_dbfs: -60.0
      # Loudest background sampled independently for each labeled recording.
      background_max_dbfs: -40.0
      # Lowest event gain sampled for synthetic recordings, in dB.
      gain_min_db: -9.0
      # Highest event gain sampled for synthetic recordings, in dB.
      gain_max_db: -1.0
      # Synthetic classes; these are not recordings of real survivors or rubble.
      kinds: [knock, clap, speech_like, footstep, drop]
      # Duration of the background-only synthetic challenge evaluation, in seconds.
      background_duration_s: 600.0
  evaluation:
    # Interval between simulated background-only challenges, in stream seconds.
    challenge_interval_s: 60.0
    # Number of waveform bins displayed in each review thumbnail.
    waveform_points: 128
    # Network timeout used only by the manually approved model fetch command.
    download_timeout_s: 60.0
    # Maximum accepted artifact download size, in bytes.
    download_max_bytes: 67108864
dialog:
  # Profile name included in dialog snapshots.
  profile: rubble
  # Sliding stream-time horizon for passive background observations, in seconds.
  rate_window_s: 600.0
  # Pseudo-count in the background-rate prior.
  prior_events: 1.0
  # Prior exposure in seconds; one event per minute before observations.
  prior_s: 60.0
  # Minimum background event rate, in events per second.
  lambda_floor: 0.0016666666666666668
  # Minimum spontaneous knocks that raise the status to POSSIBLE.
  burst_knocks: 2
  # Sliding interval for a spontaneous burst, in seconds.
  burst_window_s: 4.0
  # Quiet interval after a burst before an automatic challenge, in seconds.
  quiet_s: 1.5
  # Automatically challenge after knock bursts or fresh enabled-monitor distress alerts.
  auto_challenge: false
  # Number of knocks in the first challenge round.
  first_pattern: 3
  # Later challenge counts; the preceding count is excluded when choosing.
  patterns: [2, 3, 4]
  # Interval between prompt knocks, in seconds.
  interval_s: 0.6
  # Maximum response window, in seconds; allows slow triplets plus required silence.
  window_s: 6.4
  # End a nonempty response window after this much quiet, in seconds.
  early_close_s: 2.0
  # Match only when post-answer silence closes the round before its deadline.
  require_silence_after: true
  # Latest first answer knock after the response window opens, in seconds.
  response_start_max_s: 4.0
  # Passive listening before each challenge round, in seconds.
  pre_listen_s: 3.0
  # Pre-listen knock count that blocks a prompt and requests quiet.
  max_pre_knocks: 2
  # Maximum expected background count in a nominal response window.
  mu_max: 1.0
  # Delay before another passive noise check after requesting quiet, in seconds.
  noisy_retry_s: 5.0
  # Failed noise checks before the challenge ends with NO_RESPONSE.
  max_noisy_tries: 6
  # Reject response patterns whose successive gaps resemble a bouncing object.
  reject_bounce: true
  # Reject each successive response gap below this fraction of its predecessor.
  bounce_gap_ratio: 0.7
  # Minimum matched rounds required for confirmation.
  min_matched_rounds: 2
  # Maximum combined independent-background match probability for confirmation.
  p_confirm: 0.0001
  # Maximum challenge rounds before NO_RESPONSE.
  max_rounds: 4
  # Consecutive empty response windows before NO_RESPONSE.
  max_empty_windows: 2
  # Pause after NO_RESPONSE before returning to passive listening, in seconds.
  cooldown_s: 5.0
  # Automatically interview after a confirmed challenge.
  auto_interview: true
  # Maximum interview response window, in seconds.
  question_window_s: 10.0
  # End a nonempty interview window after this much quiet, in seconds.
  question_early_close_s: 3.0
  # Ordered interview voice keys.
  questions: [q_people, q_move, q_hurt]
prompter:
  # Use voice when an output is available, or choose none for knock-only operation.
  voice: auto
  # Continue suppressing prompt sounds for this many seconds after completion.
  gate_tail_s: 0.6
  # Directory of pre-generated voice WAVs, relative to the repository root.
  voice_dir: assets/voice
  # Extra operator time after the estimated manual knock duration, in seconds.
  manual_knock_tail_s: 0.5
  # Speaking speed used to estimate manual voice duration, in words per second.
  manual_voice_words_per_s: 2.5
  # Minimum estimated duration of a manual voice prompt, in seconds.
  manual_voice_min_s: 1.0
  # Maximum wait for the serial device's boot READY line, in seconds.
  serial_ready_timeout_s: 2.0
  # Added timeout margin after the expected serial knock duration, in seconds.
  serial_reply_margin_s: 2.0
  # Maximum wait for a serial PONG during auto-discovery, in seconds.
  serial_ping_timeout_s: 0.5
  # Maximum blocking interval of one serial read, in seconds.
  serial_read_poll_s: 0.05
  # Maximum blocking interval of one serial write, in seconds.
  serial_write_timeout_s: 1.0
  # Earliest simulated response after prompt completion, in seconds.
  fake_reply_delay_min_s: 1.0
  # Latest simulated response after prompt completion, in seconds.
  fake_reply_delay_max_s: 1.5
  # Maximum simulated timing jitter of each response knock, in seconds.
  fake_jitter_s: 0.08
  # Human-speed spacing between simulated survivor knocks, in seconds.
  fake_knock_interval_s: 0.55
  # Gain applied to synthetic survivor response knocks, in dB.
  fake_knock_gain_db: -3.0
  # Maximum duration of a survivor simulation, in stream seconds.
  sim_duration_s: 60.0
  # Duration of a simulation without a survivor, in stream seconds.
  sim_no_survivor_duration_s: 600.0
  # Synthetic simulation background RMS level, in dBFS.
  sim_background_dbfs: -50.0
  # Duration of a synthetic background generation chunk, in seconds.
  sim_chunk_s: 1.0
  # Initial spontaneous survivor knocks that invite a challenge, in seconds.
  sim_initial_knock_times_s: [0.8, 1.9]
  # Gain applied to the initial spontaneous survivor knocks, in dB.
  sim_initial_knock_gain_db: -6.0
  # Time of the first distractor when simulation noise is enabled, in seconds.
  sim_noise_first_s: 0.6
  # Spacing between simulation distractors, in seconds.
  sim_noise_interval_s: 2.7
  # Gain applied to simulation distractors, in dB.
  sim_noise_gain_db: -12.0
  # Repeating distractor sequence when simulation noise is enabled.
  sim_noise_kinds: [footstep, speech_like, drop]
server:
  # Network interface used by the dashboard server.
  host: 0.0.0.0
  # TCP port used by the dashboard server.
  port: 8000
  # Human-readable sentinel identifier displayed at the command post.
  sentinel_name: Heartbeat
  # Parent directory for timestamped black-box recordings.
  runs_dir: runs
  # Number of live events retained for reconnecting clients.
  event_history: 2000
  # Maximum pending events per WebSocket client before old events are dropped.
  client_queue: 256
  # Maximum events waiting to cross from producer threads into asyncio.
  bridge_queue_events: 4096
  # Maximum wait for a processing-thread state or command result, in seconds.
  request_timeout_s: 2.0
  # Default number of events returned by one history request.
  events_default_limit: 200
  # Maximum number of events returned by one history request.
  events_max_limit: 1000
  # Keep dashboard simulations interactive after the interview, in stream seconds.
  dashboard_sim_duration_s: 600.0
  blackbox:
    # Maximum pending event/audio records before an explicit integrity failure.
    queue_size: 8192
    # Minimum stream-time spacing between saved level events, in seconds.
    level_interval_s: 1.0
    # Maximum raw-audio interval between header/data flushes, in seconds.
    raw_flush_s: 1.0
    # Timestamp tolerance when matching replay sounds to recorded onsets, in seconds.
    replay_tolerance_s: 0.03
    # Maximum wait for optional Git metadata collection, in seconds.
    git_timeout_s: 2.0
  dashboard:
    # Width of the live audio history, in stream seconds.
    trace_seconds: 20.0
    # Maximum number of recent activity events shown in the browser.
    event_log_limit: 50
    # Delay before reconnecting a disconnected dashboard, in milliseconds.
    reconnect_ms: 1500
    # Interval between state refreshes, in milliseconds.
    state_refresh_ms: 1000
    # Lower bound of the live audio plot, in dBFS.
    trace_min_dbfs: -80.0
    # Upper bound of the live audio plot, in dBFS.
    trace_max_dbfs: 0.0
    # Vertical plot-grid spacing, in dB.
    trace_grid_db: 20.0
    # Horizontal plot-grid spacing, in seconds.
    trace_grid_s: 5.0
rover:
  # Fixed rover v1 USB serial rate, in baud.
  baud: 115200
  # Maximum serial read poll, in seconds.
  read_timeout_s: 0.05
  # Bound command writes so STOP cannot wait indefinitely behind another write.
  write_timeout_s: 0.1
  # Legacy startup setting retained for older configs; use boot_timeout_s below.
  connect_timeout_s: 5.0
  # Legacy retry setting retained for older configs; use boot_ping_interval_s below.
  connect_retry_s: 0.25
  # Maximum total wait for boot and a valid rover PONG, in seconds.
  boot_timeout_s: 4.0
  # Repeat startup PING while waiting for READY/PONG, in seconds.
  boot_ping_interval_s: 0.5
  # Maximum wait for a non-motion reply, in seconds.
  command_timeout_s: 3.0
  # Host motion timeout, in seconds; firmware independently stops after 30 seconds.
  move_timeout_s: 35.0
  # Heartbeat interval during motion; never exceed 0.5 seconds.
  heartbeat_s: 0.5
  # Maximum travel per command in centimeters; may only tighten the firmware limit.
  max_drive_cm: 100.0
  # Maximum turn per command in degrees; may only tighten the firmware limit.
  max_turn_deg: 180.0
  # Maximum motor speed percent; may only tighten the firmware limit.
  max_speed_pct: 60
  # Speed percent for manual CLI moves when --speed is omitted.
  default_speed_pct: 30
  # Smallest supported positive EEPROM calibration coefficient.
  calibration_min: 0.001
  # Largest supported EEPROM calibration coefficient.
  calibration_max: 100000.0
  # Initial wheel degrees per centimeter; approximate until measured on the rover.
  calibration_deg_per_cm: 18.0
  # Initial wheel degrees per chassis turn degree; approximate until measured.
  calibration_deg_per_turn_deg: 2.5
  # Requested straight travel for the interactive human calibration, in centimeters.
  calibration_drive_cm: 50.0
  # Requested chassis turn for the interactive human calibration, in degrees.
  calibration_turn_deg: 90.0
  # Conservative motor speed percent used during interactive calibration.
  calibration_speed_pct: 20
  # Simulated linear speed in centimeters per stream second.
  fake_speed_cm_s: 20.0
  # Simulated angular speed in degrees per stream second.
  fake_turn_deg_s: 90.0
  # Motor-off settling time before opening detection, in stream seconds.
  settle_s: 2.0
  audio_stop:
    # Opt in to automatic audio stops and operator review at every checked gap.
    enabled: false
    # all accepts distress/phrase cues and knocks; knocks accepts classified knocks only.
    trigger_mode: all
    # Perform stationary checks at route checkpoints even without an audio trigger.
    scheduled_listen: true
    # Fresh stationary audio collection period, after motor settling.
    verify_s: 8.0
    # Maximum age of a completed audio window when its result arrives.
    max_age_s: 3.0
    # Accepted classified knocks required to request investigation.
    knock_count: 3
    # Maximum interval containing the candidate knock burst.
    knock_window_s: 2.0
    # Stream-time STOP deadline; serial transport also enforces its own timeout.
    stop_timeout_s: 6.0
  # Maximum dialog time at each gap, in stream seconds.
  gap_timeout_s: 120.0
  navigation:
    # Confirmed ultrasonic connector; the line sensor on port 9 is unused.
    sensor_port: 6
    # Stop forward travel when an obstacle is this close, in cm.
    stop_cm: 30
    # Require this much front clearance before starting forward travel, in cm.
    clear_cm: 45
    # Encoder checkpoint spacing during continuous forward travel, in cm; no stop at checkpoints.
    step_cm: 20
    # Clockwise in-place search turn; direction requires hardware verification.
    turn_deg: 45
    # Maximum consecutive search turns before holding with a blocked error.
    max_turns: 8
    # Interval between front-range checks during forward movement, in milliseconds.
    poll_ms: 80
    # Motor-off settling before startup, post-turn decisions or sensor recovery, in milliseconds.
    settle_ms: 200
    # Refuse even an in-place turn when the front obstacle is closer than this, in cm.
    turn_clearance_cm: 15
    # Maximum motor-off recovery time after a missing echo, in milliseconds.
    range_retry_ms: 800
    # Consecutive valid readings agreeing on forward/turn clearance before recovery.
    range_good_reads: 2
    # Maximum exploration time per start/resume; then stop and finish, in seconds.
    duration_s: 120
  # Motor speed percent for route legs.
  speed_pct: 30
  decisions:
    # Mission evidence goes to the model; movement bounds below remain local.
    mission: "Inspect the immediate area slowly for possible people or places worth listening. Choose STOP_AND_LISTEN for possible human cues. No response never means nobody is there."
    # Total navigation budget; active audio verification/dialog can finish afterward.
    session_s: 120
    # Reject an observation this old at the actual motion dispatch, in seconds.
    observation_max_age_s: 2.5
    # Minimum interval between observation requests, in seconds.
    decision_interval_s: 0.5
    # Motor-off delay before collecting the next camera frame, in seconds.
    action_settle_s: 0.25
    # Pause before refreshing a HOLD or unexecuted proposal, in seconds.
    hold_s: 0.5
    # Model score threshold for a proposed movement; not a safety probability.
    min_confidence: 0.7
    # Fixed distance assigned to FORWARD_SHORT, in centimeters.
    forward_cm: 3.0
    # Optional total forward-command budget in cm; interrupted steps are not refunded.
    forward_budget_cm: null
    # Opt in to one uninterrupted forward target with observations during motion.
    continuous_forward: false
    # Retry no-echo readings while stopped and recover obstacle stops with fresh observations.
    autonomous_exploration: false
    # Let fresh camera decisions authorize guarded movement after explicit missing echoes.
    no_echo_camera_motion: false
    # Select whether audio/vision cues or only visual debris can start an inspection.
    inspection_trigger: audio_and_vision
    debris_approach:
      # Require a close measured arrival before a visual debris inspection.
      enabled: false
      # Target gap from the ultrasonic sensor face to debris, in centimeters.
      stop_cm: 3.0
      # Allow this much range noise at arrival, in centimeters.
      arrival_tolerance_cm: 0.5
      # Maximum encoder distance per camera-approved close approach, in centimeters.
      step_cm: 2.0
      # Fixed approach motor power; firmware caps this at 35 percent.
      speed_pct: 35
      # Firmware deadline for each approach step, in milliseconds.
      max_ms: 1000
    # Optional distance per continuous forward segment; null reserves the remaining budget.
    cruise_chunk_cm: null
    # Optional minimum nominal rover battery reading before movement is offered.
    min_battery_v: null
    # Firmware deadline for a continuous target; protocol ceiling is 30000 ms.
    cruise_max_ms: 15000
    # Fixed absolute angle assigned to either turn choice, in degrees.
    turn_deg: 10.0
    # Fixed motor speed for guarded Decisions actions; cannot be set by the model.
    speed_pct: 25
    # Firmware stops and fails if both encoder targets are not reached by this deadline.
    max_action_ms: 1000
    # Assumed mounting convention; verify physically before opting into --allow-turns.
    positive_turn_is_right: true
    # Maximum controller worker shutdown wait, in seconds.
    worker_join_s: 3.0
    # Number of recent action outcomes supplied as navigation context.
    history_size: 8
    # Maximum recent stop snapshots kept in memory for the dashboard gallery.
    stop_image_history_size: 8
    # API transport timeout; camera/API errors leave the rover stopped for review.
    read_timeout_s: 1.5
    # Image/webcam preview timeout; separate from the live movement freshness budget.
    preview_timeout_s: 15.0
    webcam_preview:
      # Separate local-only page so the existing rover dashboard can keep port 8001.
      port: 8002
      # Browser snapshot width in pixels; the live preview is resized before upload.
      width: 640
      # Browser snapshot height in pixels.
      height: 480
      # Browser JPEG encoding quality greater than 0 and at most 1.
      jpeg_quality: 0.8
      # Bound incoming JSON, including base64 JPEG and example sensor values.
      max_request_bytes: 1500000
      # Seconds allowed for pending web requests during server shutdown.
      shutdown_timeout_s: 3
    # Maximum accepted API response bytes; oversized responses cannot produce movement.
    max_response_bytes: 65536
    # Maximum JPEG input bytes; match the camera frame limit below.
    max_frame_bytes: 1048576
    # Image detail sent to Decisions; increase if important scene details are lost.
    image_detail: low
    # Numeric tolerance when validating the returned choice-probability sum.
    probability_sum_tolerance: 0.02
    action_descriptions:
      # Local distance and speed bounds are never inferred from image text.
      FORWARD_SHORT: "Advance one short forward step toward useful inspection, only if forward is offered."
      # Turning is offered only when the operator enables it and front clearance permits it.
      TURN_LEFT_SHORT: "Turn slightly left to inspect another direction; do not claim side clearance from a front photo."
      # This is the same bounded local primitive in the opposite direction.
      TURN_RIGHT_SHORT: "Turn slightly right to inspect another direction; do not claim side clearance from a front photo."
      # Starts deterministic stationary audio verification, never confirms a survivor by itself.
      STOP_AND_LISTEN: "Stop and verify possible human signals using the existing audio procedure."
      # A distinct camera choice lets stop messages identify possible debris honestly.
      INSPECT_DEBRIS: "Visible debris or a rubble pile warrants stopping for an inspection at any distance."
      # Only offered by the close-debris policy with fresh usable distance.
      APPROACH_DEBRIS: "Take a bounded close approach toward visible debris; the host fixes speed, distance and stopping gap."
      # Always available when images, sensors, progress, or the situation are ambiguous.
      HOLD: "Stay stopped and obtain a fresh observation."
    camera:
      # Raspberry Pi OS camera application; a path can be supplied by --camera-command.
      command: rpicam-vid
      # Camera frame width in pixels; frames are sent only for Decisions requests.
      width: 640
      # Camera frame height in pixels.
      height: 480
      # Local MJPEG capture rate; the controller sends selected fresh frames only.
      fps: 5
      # Maximum wait for a fresh complete frame, in seconds.
      frame_timeout_s: 3.0
      # Bound both retained JPEG size and parsing buffers.
      max_frame_bytes: 1048576
      # Maximum wait before forcibly ending a camera process during shutdown.
      shutdown_timeout_s: 1.0
      # Cancellation polling interval while waiting for a new frame, in seconds.
      cancel_poll_s: 0.05
      # Maximum bytes read per MJPEG pipe operation; keeps parsing memory bounded.
      stream_read_bytes: 65536
  # Stop the audio pipeline after the final patrol result.
  stop_on_done: true
  # The only gap with a simulated survivor in the hardware-free patrol.
  sim_survivor_gap: Gap 2
  # Inject labeled synthetic distress events only in the hardware-free demo.
  sim_audio_cue: false
  # Delay into movement before the simulated distress event.
  sim_audio_cue_after_s: 0.5
  # RGB ring color for NO_SIGNS.
  led_no_signs: [64, 64, 64]
  # RGB ring color for POSSIBLE.
  led_possible: [255, 128, 0]
  # RGB ring color for CONFIRMED.
  led_confirmed: [255, 0, 0]
